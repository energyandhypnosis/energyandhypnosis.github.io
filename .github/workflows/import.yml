name: Import site files & images
on:
  push:
    paths: ["site-bundle.txt", "images.txt"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site bundle
        shell: python
        run: |
          import os, re, subprocess
          if os.path.exists("site-bundle.txt"):
              t = open("site-bundle.txt", encoding="utf-8").read()
              t = t.replace("@@BT@@", chr(96)).replace("@@DS@@", "$" + "{")
              parts = re.split(r"^=====(FILE|DELETE) (.+?)=====\n", t, flags=re.M)
              for i in range(1, len(parts), 3):
                  kind, path, body = parts[i], parts[i + 1].strip(), parts[i + 2].rstrip("\n") + "\n"
                  if kind == "DELETE":
                      if os.path.exists(path):
                          subprocess.run(["git", "rm", "-q", path], check=True)
                          print("deleted", path)
                      continue
                  if os.path.dirname(path):
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                  open(path, "w", encoding="utf-8").write(body)
                  print("wrote", path)
              subprocess.run(["git", "rm", "-q", "site-bundle.txt"], check=True)
      - name: Download images and fonts
        run: |
          [ -f images.txt ] || exit 0
          while read -r path url; do
            case "$path" in ""|\#*) continue ;; esac
            if [ ! -s "$path" ]; then
              mkdir -p "$(dirname "$path")"
              curl -fsSL --retry 3 -o "$path" "$url" && echo "ok $path" || echo "::warning::Could not download $url"
            fi
          done < images.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import site files and images"
          git push
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will build on its own"
