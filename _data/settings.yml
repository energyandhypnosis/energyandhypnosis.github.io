# ── Email / newsletter (MailerLite) ───────────────────────────
# Every form on the site adds the person to your newsletter.
# 1. In MailerLite create a group called "Newsletter" plus one group per freebie.
# 2. Create an Embedded form for each freebie (Forms → Embedded forms). In each
#    form's settings, tick BOTH "Newsletter" and that freebie's group.
# 3. Open the form's HTML code. You'll see a URL like:
#    https://assets.mailerlite.com/jsonp/1234567/forms/987654321/subscribe
#    1234567 = account_id,  987654321 = the form id.
# Until these are filled in, forms just go straight to the thank-you page
# (handy for testing) and NO email is saved.
mailerlite:
  account_id: ""
  forms:
    newsletter: ""      # footer / blog "join the newsletter" form
    protocol: ""        # 30-Day Reset Protocol (PDF)
    audio: ""           # free hypnosis audio
    workshop: ""        # weekly workshop
    app_waitlist: ""    # app / courses waitlist

# ── Free weekly workshop ──────────────────────────────────────
# Leave a field blank to hide it on the site.
workshop:
  name: Free Weekly Tranceform Workshop
  day: ""               # e.g. Wednesday
  time_24h: ""          # e.g. "19:00"  (Budapest time)
  duration_minutes: 60
  zoom_link: ""         # shown on the thank-you page and emailed by MailerLite

