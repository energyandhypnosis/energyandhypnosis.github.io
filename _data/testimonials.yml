- name: Daniela
  text: |
    I had a Reiki and energy healing session with Melissa, and it was such a calming experience. Life can move so fast, and the session felt like a moment where everything just slowed down and I could finally breathe and be present.

    It wasn’t about some huge dramatic shift, but more about giving myself the space to just be. I felt really relaxed during the session, and afterwards I noticed a quiet sense of calm that stayed with me.

    It felt like a gentle reset — a reminder to slow down and take time for myself. I’m really grateful for the experience and would definitely recommend it to anyone looking for a peaceful moment to reconnect with themselves.
- name: Bruno
  text: |
    Since we began working together, I've noticed a significant shift within myself. I've come to recognize how much of my natural sexuality I had been holding back, even though I've always had the knowledge and ability to express it with more presence and depth than many. That realization alone was incredibly freeing.

    Through our sessions, I also became aware of the stress I had been carrying — stress that had been quietly reawakening old fears and limitations. But the energy we exchanged and the self-awareness that emerged helped me reconnect with who I truly am.

    I feel more grounded, more empowered, and more whole. It's as though I'm fully myself now — in every way.
- name: Shivani
  text: |
    But today’s session was something I did not expect! I really can’t believe that I spoke about my dream which is not fulfilled. I like performing and acting a lot from my childhood, but I stopped focusing on my interests and started working towards my career.

    I had totally forgotten about this. But today during hypnotherapy everything came back to me.

    I originally came to you to heal after a breakup. I was not expecting to reconnect with my dreams and experience so much more happiness and confidence.
- name: Tomi
  text: |
    I was struggling with chronic nerve pain in my legs from diabetes for the past 20 years. I didn’t realize the pain was connected to so many early life experiences that needed healing.

    I’m happy that today the pain is completely gone. I learned a lot about myself, I started new habits, and I began to develop my spiritual gifts.
- name: Ozan
  text: |
    I wasn't expecting such positive and radical changes after the sessions. Even though it has only been a short period of time, I can clearly see the difference between my previous and current reactions toward tough situations.

    I have been experiencing a lot of improvement in regulating my emotions.
